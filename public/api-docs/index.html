<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API 문서 — 나라장터 개찰결과 조회</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5.32.8/swagger-ui.css"
    />
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.32.8/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        // 절대 경로 — /api-docs (trailing slash 없는 접근) 시 상대경로 오해석 방지
        url: "/api-docs/openapi.yaml",
        dom_id: "#swagger-ui",
        tryItOutEnabled: true,
      });
    </script>
  </body>
</html>
